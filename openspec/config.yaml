schema: spec-driven

rules:
  proposal:
    - "Si el change modifica el comportamiento o las pantallas de un módulo que tiene lecciones en fme-backend/capacitacion/<modulo>/, indicarlo en Impact (\"Capacitación: lecciones afectadas ...\")."
    - "Si el change crea, modifica, desactiva o elimina un workflow de n8n, indicarlo en Capabilities como Modified Capability `integracion-n8n` e incluir el delta de esa spec (ADDED/MODIFIED/REMOVED) con nombre, ID, disparador, dirección, contrato del payload y si es crítico."
  tasks:
    - "Si el change modifica el comportamiento o las pantallas de un módulo que tiene lecciones en fme-backend/capacitacion/<modulo>/, incluir un grupo de tareas \"Actualizar capacitación\" que liste las lecciones afectadas (o las nuevas a crear), actualizar su fecha de última revisión y verificar en el visor del backoffice. El change no se considera terminado sin esto."
    - "Si el change crea, modifica, desactiva o elimina un workflow de n8n, incluir un grupo de tareas \"Registrar workflow n8n\": (1) delta de la spec `integracion-n8n`, (2) exportar con `python scripts/n8n_exportar.py` (o `--podar`) y commitear `n8n/workflows/`, (3) actualizar la tabla de `n8n/README.md`. El change no se considera terminado sin esto."
