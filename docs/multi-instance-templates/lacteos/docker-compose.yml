version: '3.8'

# Instancia de Lácteos - Ports: 8004, 3004, 3005, 5436
services:
  # Base de datos PostgreSQL
  db:
    image: postgres:14
    container_name: fme_lacteos_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fme_lacteos
      POSTGRES_PASSWORD: fme_lacteos_pass
      POSTGRES_DB: fme_lacteos_db
    ports:
      - "5436:5432"
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fme_lacteos"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build:
      context: ../../../fme-backend
      dockerfile: Dockerfile
    container_name: fme_lacteos_backend
    restart: unless-stopped
    ports:
      - "8004:8000"
    environment:
      DATABASE_URL: postgresql://fme_lacteos:fme_lacteos_pass@db:5432/fme_lacteos_db
      INSTANCE_TYPE: lacteos
      BUSINESS_NAME: "Quesería Artesanal"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/instance_data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Landing page
  landing:
    build:
      context: ../../../fme-landing
      dockerfile: Dockerfile.prod
    container_name: fme_lacteos_landing
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8004
      NEXT_PUBLIC_BUSINESS_TYPE: lacteos
      NEXT_PUBLIC_BUSINESS_NAME: "Quesería Artesanal"
      NODE_ENV: production
    depends_on:
      - backend

  # Backoffice
  backoffice:
    build:
      context: ../../../fme-backoffice
      dockerfile: Dockerfile.prod
    container_name: fme_lacteos_backoffice
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8004
      NEXT_PUBLIC_BUSINESS_TYPE: lacteos
      NEXT_PUBLIC_BUSINESS_NAME: "Quesería Artesanal"
      NODE_ENV: production
    depends_on:
      - backend

networks:
  default:
    name: fme_lacteos_network