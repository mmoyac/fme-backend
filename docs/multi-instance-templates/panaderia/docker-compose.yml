version: '3.8'

# Instancia de Panadería - Ports: 8000, 3000, 3001, 5432
services:
  # Base de datos PostgreSQL
  db:
    image: postgres:14
    container_name: fme_panaderia_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fme_panaderia
      POSTGRES_PASSWORD: fme_panaderia_pass
      POSTGRES_DB: fme_panaderia_db
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fme_panaderia"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Backend API
  backend:
    build: 
      context: ../../../fme-backend
      dockerfile: Dockerfile
    container_name: fme_panaderia_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://fme_panaderia:fme_panaderia_pass@db:5432/fme_panaderia_db
      INSTANCE_TYPE: panaderia
      BUSINESS_NAME: "Panadería Artesanal"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/instance_data
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/docs')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Landing page
  landing:
    build:
      context: ../../../fme-landing
      dockerfile: Dockerfile.prod
    container_name: fme_panaderia_landing
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BUSINESS_TYPE: panaderia
      NEXT_PUBLIC_BUSINESS_NAME: "Panadería Artesanal"
      NODE_ENV: production
    depends_on:
      - backend

  # Backoffice
  backoffice:
    build:
      context: ../../../fme-backoffice
      dockerfile: Dockerfile.prod
    container_name: fme_panaderia_backoffice
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_BUSINESS_TYPE: panaderia
      NEXT_PUBLIC_BUSINESS_NAME: "Panadería Artesanal"
      NODE_ENV: production
    depends_on:
      - backend

networks:
  default:
    name: fme_panaderia_network