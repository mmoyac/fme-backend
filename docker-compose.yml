version: '3.8'

services:
  db:
    image: postgres:14
    container_name: fme-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fme-network

  backend:
    build: .
    container_name: fme-backend
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      INTEGRATION_API_KEY: ${INTEGRATION_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      # Pasarelas de pago (change add-pasarelas-pago). Sin ENTORNO=desarrollo el backend se comporta como producción.
      ENTORNO: desarrollo
      PASARELAS_CLAVE_MAESTRA: ${PASARELAS_CLAVE_MAESTRA:-}
      URL_PUBLICA_PAGOS: ${URL_PUBLICA_PAGOS:-}
    networks:
      - fme-network

volumes:
  postgres_data:


networks:
  fme-network:
    driver: bridge
